<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unitflow Login</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="auth-brand">
          <div class="auth-brand-mark">U</div>
          <span>unitflow</span>
        </div>

        <div>
          <h1 class="tagline">
            Track every unit with clarity.
            <small>Client asset monitoring for branch operations and support teams.</small>
          </h1>
        </div>
      </div>

      <div class="auth-card">
        <div class="auth-card-inner">
          <div class="auth-card-header">
            <h2>Sign in</h2>
            <p>Use your account credentials to continue</p>
          </div>

          <form class="auth-form" id="loginForm">
            <div class="form-field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" placeholder="Enter username" required />
            </div>

            <div class="form-field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="Enter password" required />
            </div>

            <button type="submit" class="auth-button">Login</button>
          </form>

          <div class="auth-link">
            Need help? <a href="#" id="contactAdminLink">Contact admin</a>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="contactAdminBackdrop" aria-hidden="true">
      <div class="modal message-modal" role="dialog" aria-modal="true" aria-labelledby="contactAdminTitle">
        <div class="modal-header"><h3 id="contactAdminTitle">Contact admin</h3><button class="modal-close" id="contactAdminClose" type="button" aria-label="Close contact form">×</button></div>
        <form class="modal-body auth-form" id="contactAdminForm">
          <p>Send a message to Super Admin and Administrator.</p>
          <div class="form-field"><label for="contactAdminName">Your name</label><input id="contactAdminName" name="name" type="text" required /></div>
          <div class="form-field"><label for="contactAdminContact">Email</label><input id="contactAdminContact" name="contact" type="email" required /></div>
          <div class="form-field"><label for="contactAdminMessage">Message</label><textarea id="contactAdminMessage" name="message" rows="4" required></textarea></div>
          <div class="modal-actions"><button type="button" class="action-btn" id="contactAdminCancel">Cancel</button><button type="submit" class="action-btn primary">Send message</button></div>
        </form>
      </div>
    </div>

    <script src="gs/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
