<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branches</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="dashboard-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">U</div>
        <span>unitflow</span>
      </div>

      <nav class="nav">
        <div class="nav-label">Workspace</div>
        <a class="nav-item" href="../index.html">
          <span class="nav-icon">▣</span>
          Dashboard
        </a>
        <a class="nav-item messages-nav-item" href="messages.html" aria-label="Open Messages">
          <span class="nav-icon">✉</span>
          Messages
          <span class="nav-count" data-message-nav-count hidden></span>
        </a>
        <div class="nav-group" data-unit-menu>
          <div class="nav-group-header">
            <a class="nav-item" href="units.html?view=monitoring">
              <span class="nav-icon">▤</span>
              Units
            </a>
            <button class="nav-collapse-btn" type="button" data-unit-menu-toggle aria-expanded="false" aria-label="Expand Units menu" title="Expand Units menu"></button>
          </div>
          <div class="nav-submenu" aria-label="Unit views" hidden>
          <a class="nav-item nav-subitem" href="units.html?view=for-release">For Release</a>
          <a class="nav-item nav-subitem" href="units.html?view=released">Released</a>
          <a class="nav-item nav-subitem" href="units.html?view=replaced">For Replacement</a>
          <a class="nav-item nav-subitem" href="units.html?view=warehouse">Warehouse</a>
          <a class="nav-item nav-subitem" href="units.html?view=pull-out">Pull Out</a>
          <a class="nav-item nav-subitem" href="trash.html">Trash</a>
          </div>
        </div>
        <a class="nav-item active" href="branches.html">
          <span class="nav-icon">⎇</span>
          Branches
        </a>
        <a class="nav-item" href="accounts.html">
          <span class="nav-icon">◉</span>
          Accounts
        </a>
        <a class="nav-item" id="settingsLink" href="settings.html">
          <span class="nav-icon">⚙</span>
          Settings
        </a>
      </nav>
    </aside>

    <div class="workspace">
      <header class="workspace-topbar">
        <div class="breadcrumb">Workspace <span>/</span> Branches</div>

        <div class="topbar-right">
          <div class="sync-pill">
            <span class="dot live"></span>
            <span>Live sync</span>
          </div>

          <div class="user-menu">
            <button class="user-pill" id="userMenuButton" type="button" aria-expanded="false">
              <div class="user-avatar">TS</div>
              <span id="topbarUserName">Technician</span>
            </button>
            <div class="user-dropdown" id="userDropdown" hidden>
              <button type="button" id="logoutButton">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <main class="content branches-content">
        <div class="accounts-heading branches-heading">
          <div>
            <div class="eyebrow">Workspace</div>
            <h1>Branches</h1>
            <p>Browse locations and manage branch assignments.</p>
          </div>
          <span class="accounts-result-count" id="branchResultCount" aria-live="polite"></span>
        </div>

        <div class="page-toolbar">
          <div class="search-box">
            <input id="branchesSearchInput" type="search" placeholder="Search branches" aria-label="Search branches" />
          </div>
          <select class="toolbar-select" id="branchTypeFilter" aria-label="Filter branches by type">
            <option value="all">All types</option>
          </select>
          <select class="toolbar-select" id="branchStatusFilter" aria-label="Filter branches by status">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="disabled">Disabled</option>
          </select>

          <div class="page-actions">
            <button class="action-btn primary" id="openBranchModalBtn">+ Add branch</button>
          </div>
        </div>

        <section class="accounts-directory branch-directory" aria-label="Workspace branches">
          <div class="accounts-member-list" id="branchesTableBody" aria-live="polite">
            <div class="member-list-empty">Loading branches…</div>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="branchModalBackdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="branchModalTitle">
        <div class="modal-header">
          <h3 id="branchModalTitle">Add Branch</h3>
          <button class="modal-close" id="closeBranchModalBtn" aria-label="Close modal">×</button>
        </div>

        <form class="unit-form" id="branchForm">
          <div class="form-grid">
            <div class="field-group">
              <label for="branchType">Branch Type</label>
              <select id="branchType" name="branchType" required>
                <option value="">Select branch type</option>
                <option value="BNB">BNB</option>
                <option value="EZ">EZ</option>
                <option value="1LR">1LR</option>
              </select>
            </div>

            <div class="field-group">
              <label for="branchName">Branch Name</label>
              <input id="branchName" name="branchName" type="text" placeholder="e.g. BNB Rosales" readonly required />
            </div>

            <div class="field-group">
              <label for="branchLocation">Location</label>
              <input id="branchLocation" name="branchLocation" type="text" placeholder="e.g. Rosales, Pangasinan" required />
            </div>

            <div class="field-group">
              <label for="headAdminSelect">Head Admin</label>
              <select id="headAdminSelect" name="headAdminSelect">
                <option value="">Loading head admins…</option>
              </select>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="action-btn" id="cancelBranchModalBtn">Cancel</button>
            <button type="submit" class="action-btn primary">Save Branch</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="messageModalBackdrop" aria-hidden="true">
      <div class="modal message-modal" role="dialog" aria-modal="true" aria-labelledby="messageModalTitle">
        <div class="modal-header">
          <h3 id="messageModalTitle">Notice</h3>
          <button class="modal-close" id="closeMessageModalBtn" aria-label="Close message">×</button>
        </div>
        <div class="modal-body" id="messageModalBody"></div>
        <div class="modal-actions">
          <button type="button" class="action-btn primary" id="okMessageModalBtn">OK</button>
        </div>
      </div>
    </div>

    <script src="../gs/config.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/user-menu.js"></script>
    <script src="../js/branches.js"></script>
  </body>
</html>
