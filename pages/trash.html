<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trash | Unitflow</title>
        <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
        <link rel="stylesheet" href="../css/styles.css" />
    </head>
    <body class="dashboard-shell">
        <aside class="sidebar">
            <div class="brand"><div class="brand-mark">U</div><span>unitflow</span></div>
            <nav class="nav">
                <div class="nav-label">Workspace</div>
                <a class="nav-item" href="../index.html"><span class="nav-icon">▣</span>Overview</a>
                <a class="nav-item messages-nav-item" href="messages.html" aria-label="Open Messages"><span class="nav-icon">✉</span>Messages<span class="nav-count" data-message-nav-count hidden></span></a>
                <a class="nav-item" href="unit-registry.html"><span class="nav-icon">▤</span>Unit registry</a>
                <a class="nav-item" href="trash.html"><span class="nav-icon">⌫</span>Trash</a>
                <a class="nav-item" href="branches.html"><span class="nav-icon">⎇</span>Branches</a>
                <a class="nav-item" href="accounts.html"><span class="nav-icon">◉</span>Accounts</a>
                <a class="nav-item" id="settingsLink" href="settings.html"><span class="nav-icon">⚙</span>Settings</a>
            </nav>
        </aside>

        <div class="workspace">
            <header class="workspace-topbar">
                <div class="breadcrumb">Workspace <span>/</span> Trash</div>
                <div class="topbar-right">
                    <div class="sync-pill"><span class="dot live"></span><span id="trashSyncStatus">Live sync</span></div>
                    <div class="user-menu">
                        <button class="user-pill" id="userMenuButton" type="button" aria-expanded="false"><div class="user-avatar">TS</div><span id="topbarUserName">Technician</span></button>
                        <div class="user-dropdown" id="userDropdown" hidden><button type="button" id="logoutButton">Logout</button></div>
                    </div>
                </div>
            </header>

            <main class="content">
                <div class="header-row">
                    <div class="heading-block">
                        <div class="eyebrow">Recovery workspace</div>
                        <h1>Trash</h1>
                        <p>Deleted units stay here for 30 days before permanent removal.</p>
                    </div>
                </div>

                <div class="page-toolbar">
                    <div class="search-box"><input id="trashSearchInput" type="search" placeholder="Search deleted units" aria-label="Search deleted units" /></div>
                    <div class="page-actions">
                        <button class="action-btn danger" id="purgeAllTrashBtn" type="button">Delete all permanently</button>
                    </div>
                </div>

                <section class="panel table-panel">
                    <div class="table-wrap">
                        <table class="unit-registry-table trash-table">
                            <thead><tr><th>Code</th><th>Client Name</th><th>Branch</th><th>Deleted At</th><th>Expires At</th><th>Actions</th></tr></thead>
                            <tbody id="trashTableBody"><tr><td colspan="6" class="empty-state">Loading deleted units…</td></tr></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>

        <div class="modal-backdrop" id="trashMessageModalBackdrop" aria-hidden="true">
            <div class="modal message-modal" role="dialog" aria-modal="true" aria-labelledby="trashMessageModalTitle">
                <div class="modal-header"><h3 id="trashMessageModalTitle">Notice</h3><button class="modal-close" id="closeTrashMessageBtn" type="button" aria-label="Close message">×</button></div>
                <div class="modal-body" id="trashMessageModalBody"></div>
                <div class="modal-actions"><button type="button" class="action-btn primary" id="okTrashMessageBtn">OK</button></div>
            </div>
        </div>

        <div class="message-toast" id="trashToast" role="status" aria-live="polite" aria-atomic="true"></div>

        <script src="../gs/config.js"></script>
        <script src="../js/data.js"></script>
        <script src="../js/user-menu.js"></script>
        <script src="../js/popup.js"></script>
        <script src="../js/trash.js"></script>
    </body>
</html>
